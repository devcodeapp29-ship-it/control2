<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Monaguillos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Encabezado Principal -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-church text-amber-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide text-white">Monaguillos Santa Catalina</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    <i class="fa-solid fa-wifi mr-1"></i> Sincronizado
                </span>
                <span id="date-display" class="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-md border border-slate-700"></span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 mt-6">
        
        <!-- Pestañas / Navegación interna -->
        <div class="flex border-b border-slate-700 mb-6 space-x-2">
            <button onclick="switchTab('asistencia')" id="tab-asistencia" class="py-2 px-4 font-medium text-sm rounded-t-lg bg-amber-500 text-slate-950 flex items-center gap-2">
                <i class="fa-solid fa-clipboard-user"></i> Tomar Asistencia
            </button>
            <button onclick="switchTab('historico')" id="tab-historico" class="py-2 px-4 font-medium text-sm rounded-t-lg bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> Histórico
            </button>
        </div>

        <!-- Vista de Tomar Asistencia -->
        <section id="view-asistencia" class="space-y-6">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200">Asistencia del Día</h2>
                    <p class="text-xs text-slate-400">Selecciona el estado para cada uno de los 38 monaguillos</p>
                </div>
                <button onclick="guardarAsistencia()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 py-2.5 rounded-lg font-bold shadow-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Registros
                </button>
            </div>

            <!-- Grid de Tarjetas de Monaguillos -->
            <div id="grid-acolitos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se genera dinámicamente con JS -->
            </div>
        </section>

        <!-- Vista de Histórico -->
        <section id="view-historico" class="hidden space-y-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h2 class="text-lg font-semibold text-slate-200 mb-4">Registros Guardados</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Monaguillo</th>
                                <th class="p-3">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-historico" class="divide-y divide-slate-700">
                            <!-- Datos históricos -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal para Editar Perfil / Notas -->
    <div id="modal-edit" class="fixed inset-0 bg-black/70 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-100" id="modal-title">Editar Detalle</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <input type="hidden" id="edit-id">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Nombre Completo</label>
                <input type="text" id="edit-name" readonly class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Notas / Observaciones</label>
                <textarea id="edit-notes" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-100 focus:border-amber-500 focus:outline-none" placeholder="Agregar nota personal..."></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs font-semibold">Cancelar</button>
                <button onclick="guardarCambiosModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded text-xs">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Script Lógico Principal -->
    <script>
        // --- 1. CONFIGURACIÓN DE SUPABASE ---
        // (Sustituye estas credenciales si tienes un proyecto propio configurado)
        const SUPABASE_URL = 'https://xyzcompany.supabase.co';
        const SUPABASE_KEY = 'public-anon-key';
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // --- 2. LISTA OFICIAL DE 38 MONAGUILLOS ---
        const OFICIALES = [
            "Andrea", "Ángela", "Angelina", "Ariel", "Aylin", "Camila", "Carlitos",
            "Carlos", "Cesar", "Cristofer", "Diego", "Edwin", "Emerson", "Estebana",
            "Fátima", "Gabi", "Gerson", "Guillermo", "Ignacio", "Jacqueline", "Javier",
            "Jimena", "José", "Juan", "Lucas", "Luis", "Manuel", "Mateo", "Matías",
            "Miguel", "Mónica", "Néstor", "Noemí", "Pablo", "Raúl", "Roxana", "Sofía", "Natalia Pérez"
        ];

        // Estado Global
        let acolitosData = JSON.parse(localStorage.getItem('acolitos_local')) || OFICIALES.map((n, i) => ({ id: i + 1, nombre: n, estado: 'presente', notas: '' }));
        let historicoData = JSON.parse(localStorage.getItem('historico_local')) || [];

        // Inicialización al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toLocaleDateString('es-ES', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            document.getElementById('date-display').innerText = today;
            
            renderGrid();
            cargarDesdeSupabase();
        });

        // --- 3. RENDERING UI ---
        function renderGrid() {
            const grid = document.getElementById('grid-acolitos');
            grid.innerHTML = '';

            acolitosData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-md hover:border-slate-600 transition";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-slate-100">${item.id}. ${item.nombre}</span>
                        <button onclick="openModal(${item.id})" class="text-slate-400 hover:text-amber-400 text-xs transition">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                    ${item.notas ? `<p class="text-xs text-amber-300/80 italic bg-slate-900/50 p-2 rounded border border-amber-500/10"><i class="fa-regular fa-note-sticky mr-1"></i>${item.notas}</p>` : ''}
                    <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700/50">
                        <button onclick="setEstado(${item.id}, 'presente')" class="py-1 text-xs font-semibold rounded ${item.estado === 'presente' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                            Presente
                        </button>
                        <button onclick="setEstado(${item.id}, 'permiso')" class="py-1 text-xs font-semibold rounded ${item.estado === 'permiso' ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                            Permiso
                        </button>
                        <button onclick="setEstado(${item.id}, 'ausente')" class="py-1 text-xs font-semibold rounded ${item.estado === 'ausente' ? 'bg-rose-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                            Ausente
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setEstado(id, estado) {
            const target = acolitosData.find(a => a.id === id);
            if (target) {
                target.estado = estado;
                saveLocal();
                renderGrid();
            }
        }

        // --- 4. ACCIONES Y SUPABASE ---
        async function guardarAsistencia() {
            const fecha = new Date().toISOString().split('T')[0];
            const nuevosRegistros = acolitosData.map(a => ({
                fecha: fecha,
                acolito_id: a.id,
                nombre: a.nombre,
                estado: a.estado,
                notas: a.notas || ''
            }));

            // Actualizar arreglo local
            historicoData.unshift(...nuevosRegistros);
            saveLocal();
            renderHistorico();

            // Sincronizar con Supabase si está disponible
            if (supabase) {
                updateBadge('Sincronizando...', 'bg-amber-500/20 text-amber-400 border-amber-500/30');
                try {
                    const { error } = await supabase.from('historial_asistencias').insert(nuevosRegistros);
                    if (error) throw error;
                    updateBadge('Sincronizado', 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30');
                    alert("¡Asistencia del día guardada correctamente!");
                } catch (err) {
                    console.warn("Supabase no configurado o falló, guardado localmente:", err.message);
                    updateBadge('Modo Local', 'bg-slate-700 text-slate-300 border-slate-600');
                    alert("Registros guardados correctamente en este dispositivo.");
                }
            } else {
                alert("Registros guardados en el almacenamiento local de tu dispositivo.");
            }
        }

        async function cargarDesdeSupabase() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase.from('historial_asistencias').select('*').order('created_at', { ascending: false }).limit(100);
                if (error) throw error;
                if (data && data.length > 0) {
                    historicoData = data;
                    saveLocal();
                }
            } catch (err) {
                console.log("No se pudo cargar desde la nube, utilizando respaldo local.");
            }
        }

        function saveLocal() {
            localStorage.setItem('acolitos_local', JSON.stringify(acolitosData));
            localStorage.setItem('historico_local', JSON.stringify(historicoData));
        }

        function updateBadge(text, classes) {
            const badge = document.getElementById('status-badge');
            badge.className = `px-3 py-1 rounded-full text-xs font-semibold border ${classes}`;
            badge.innerHTML = `<i class="fa-solid fa-wifi mr-1"></i> ${text}`;
        }

        // --- 5. VISTAS Y MODAL ---
        function switchTab(tab) {
            const viewAsis = document.getElementById('view-asistencia');
            const viewHist = document.getElementById('view-historico');
            const btnAsis = document.getElementById('tab-asistencia');
            const btnHist = document.getElementById('tab-historico');

            if (tab === 'asistencia') {
                viewAsis.classList.remove('hidden');
                viewHist.classList.add('hidden');
                btnAsis.className = "py-2 px-4 font-medium text-sm rounded-t-lg bg-amber-500 text-slate-950 flex items-center gap-2";
                btnHist.className = "py-2 px-4 font-medium text-sm rounded-t-lg bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center gap-2";
            } else {
                viewAsis.classList.add('hidden');
                viewHist.classList.remove('hidden');
                btnHist.className = "py-2 px-4 font-medium text-sm rounded-t-lg bg-amber-500 text-slate-950 flex items-center gap-2";
                btnAsis.className = "py-2 px-4 font-medium text-sm rounded-t-lg bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center gap-2";
                renderHistorico();
            }
        }

        function renderHistorico() {
            const tbody = document.getElementById('tabla-historico');
            tbody.innerHTML = '';
            if (historicoData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500 italic">No hay registros guardados aún.</td></tr>`;
                return;
            }
            historicoData.slice(0, 50).forEach(reg => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-mono text-xs text-slate-400">${reg.fecha || 'Hoy'}</td>
                    <td class="p-3 font-medium text-slate-200">${reg.nombre}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold ${reg.estado === 'presente' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : reg.estado === 'permiso' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}">
                            ${reg.estado}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal(id) {
            const item = acolitosData.find(a => a.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-name').value = item.nombre;
            document.getElementById('edit-notes').value = item.notas || '';
            document.getElementById('modal-edit').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-edit').classList.add('hidden');
        }

        function guardarCambiosModal() {
            const id = parseInt(document.getElementById('edit-id').value);
            const notes = document.getElementById('edit-notes').value;
            const target = acolitosData.find(a => a.id === id);
            if (target) {
                target.notas = notes;
                saveLocal();
                renderGrid();
            }
            closeModal();
        }
    </script>
</body>
</html>
